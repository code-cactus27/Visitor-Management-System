<!-- TOAST STACK -->
<div class="toast-container">
  <div *ngFor="let note of activeNotifications" class="toast-item" [ngClass]="note.type">
    <div class="toast-icon">
      <i class="fas" [ngClass]="{
        'fa-check-circle': note.type === 'success',
        'fa-info-circle': note.type === 'info',
        'fa-exclamation-triangle': note.type === 'warning',
        'fa-times-circle': note.type === 'error'
      }"></i>
    </div>
    <div class="toast-content">
      <strong>{{ note.title }}</strong>
      <p>{{ note.message }}</p>
    </div>
    <button class="toast-close" (click)="removeNotification(note.id)">
      <i class="fas fa-times"></i>
    </button>
  </div>
</div>
<!-- HISTORY DRAWER -->
<div class="notification-drawer" [class.open]="isDrawerOpen">
  <div class="drawer-header">
    <h3>
      <i class="fas fa-bell"></i>
      Recent Alerts
    </h3>
    <div class="drawer-actions">
      <button class="btn-text" (click)="clearAll()" *ngIf="history.length > 0">Clear All</button>
      <button class="btn-icon" (click)="toggleDrawer()">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
  <div class="drawer-body">
    <div *ngIf="history.length === 0" class="empty-state">
      <i class="fas fa-bell-slash"></i>
      <p>No recent check-ins or alerts.</p>
    </div>
    <div *ngFor="let note of history" class="history-item" [ngClass]="note.type">
      <div class="history-icon">
        <i class="fas" [ngClass]="{
          'fa-user-check': note.title === 'New Check-in',
          'fa-check-circle': note.type === 'success' && note.title !== 'New Check-in',
          'fa-info-circle': note.type === 'info',
          'fa-exclamation-triangle': note.type === 'warning',
          'fa-times-circle': note.type === 'error'
        }"></i>
      </div>
      <div class="history-content">
        <div class="history-title-row">
          <strong>{{ note.title }}</strong>
          <span class="history-time">{{ note.timestamp | date:'shortTime' }}</span>
        </div>
        <p>{{ note.message }}</p>
      </div>
    </div>
  </div>
</div>
<!-- OVERLAY -->
<div class="drawer-overlay" *ngIf="isDrawerOpen" (click)="toggleDrawer()"></div>

<nav class="sidebar" [class.sidebar-open]="isSidebarOpen">
  <div class="logo-section">
    <a class="navbar-brand">Admin Dashboard</a>
  </div>
  <ul class="nav-menu">
    <li class="nav-item">
      <a class="nav-link" routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/admin/users" routerLinkActive="active">
        <i class="fas fa-user-cog"></i>
        <span>User Management</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/admin/reports" routerLinkActive="active">
        <i class="fas fa-chart-line"></i>
        <span>Report Dashboard</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/admin/export_csv" routerLinkActive="active">
        <i class="fas fa-file-export"></i>
        <span>Visitor Export</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/admin/settings" routerLinkActive="active">
        <i class="fas fa-cog"></i>
        <span>Settings</span>
      </a>
    </li>
  </ul>
  <div class="sidebar-footer">
    <ul class="footer-actions">
      <li>
        <button (click)="onLogout()" class="btn">
          <i class="fas fa-sign-out-alt"></i>
          Logout
        </button>
      </li>
      <li>
        <button class="btn" (click)="themeService.toggleTheme()">
          <i class="fas" [ngClass]="themeService.isDark ? 'fa-sun' : 'fa-moon'"></i>
          {{ themeService.isDark ? 'Light Mode' : 'Dark Mode' }}
        </button>
      </li>
    </ul>
  </div>
</nav>
<!-- Mobile Toggle Button -->
<button class="mobile-toggle" (click)="toggleSidebar()">
  <i class="fas" [class.fa-bars]="!isSidebarOpen" [class.fa-times]="isSidebarOpen"></i>
</button>

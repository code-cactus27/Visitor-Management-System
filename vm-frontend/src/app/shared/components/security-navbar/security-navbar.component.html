<!-- Mobile toggle -->
<button class="mobile-toggle" (click)="isSidebarOpen = !isSidebarOpen">
  <i class="fas" [class.fa-bars]="!isSidebarOpen" [class.fa-times]="isSidebarOpen"></i>
</button>

<nav class="sidebar" [class.sidebar-open]="isSidebarOpen">

  <!-- Brand -->
  <div class="logo-section">
    <a class="navbar-brand">Security Panel</a>
  </div>

  <!-- Nav links -->
  <ul class="nav-menu">
    <li class="nav-item">
      <a class="nav-link" routerLink="/security/dashboard" routerLinkActive="active">
        <i class="fas fa-chart-pie"></i>
        <span>Dashboard</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/security/search" routerLinkActive="active">
        <i class="fas fa-users"></i>
        <span>Visitor Records</span>
      </a>
    </li>
  </ul>

  <!-- ── EMERGENCY SECTION ──────────────────────────────────── -->
  <div class="emergency-section">

    <!-- RAISE button (no active alert) -->
    <button
      class="emergency-btn raise-btn"
      *ngIf="!currentAlert"
      (click)="openEmergencyPicker()">
      <i class="fas fa-triangle-exclamation"></i>
      <span>Raise Emergency Alert</span>
    </button>

    <!-- DISMISS button (alert active) — security officer only -->
    <button
      class="emergency-btn dismiss-btn"
      *ngIf="currentAlert"
      (click)="dismissAlert()">
      <i class="fas fa-circle-xmark"></i>
      <span>Dismiss Alert</span>
    </button>

    <!-- Active alert badge -->
    <div class="active-alert-badge" *ngIf="currentAlert">
      <i class="fas" [ngClass]="currentAlert.icon"></i>
      <div class="badge-text">
        <strong>ACTIVE</strong>
        <span>{{ currentAlert.title }}</span>
      </div>
      <span class="badge-pulse"></span>
    </div>

  </div>

  <!-- Footer -->
  <div class="sidebar-footer">
    <ul class="footer-actions">
      <li>
        <button (click)="onLogout()" class="btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </li>
      <li>
        <button class="btn" (click)="themeService.toggleTheme()">
          <i class="fas" [ngClass]="themeService.isDark ? 'fa-sun' : 'fa-moon'"></i>
          {{ themeService.isDark ? 'Light Mode' : 'Dark Mode' }}
        </button>
      </li>
    </ul>
  </div>

</nav>
<!-- END nav.sidebar -->

<!-- ══ EMERGENCY PICKER — outside <nav> to avoid overflow:hidden clip ══ -->
<div class="picker-overlay" *ngIf="showEmergencyPicker">
  <div class="picker-box">

    <!-- Header -->
    <div class="picker-header">
      <div class="picker-title">
        <i class="fas fa-triangle-exclamation"></i>
        Raise Emergency Alert
      </div>
      <button class="picker-close" (click)="closeEmergencyPicker()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="picker-body">

      <!-- Section: predefined types -->
      <p class="picker-section-label">
        <i class="fas fa-bolt"></i> Quick Alerts
      </p>

      <div class="alert-type-grid">
        <button
          class="alert-type-btn"
          *ngFor="let t of predefinedTypes"
          [ngClass]="'type-' + t.color"
          (click)="raiseAlert(t.type)">
          <div class="alert-type-icon">
            <i class="fas" [ngClass]="t.icon"></i>
          </div>
          <div class="alert-type-text">
            <strong>{{ t.title }}</strong>
            <span>{{ t.message | slice:0:55 }}…</span>
          </div>
        </button>
      </div>

    </div><!-- /.picker-body -->

    <div class="picker-footer">
      <button class="btn-cancel" (click)="closeEmergencyPicker()">
        Cancel
      </button>
    </div>

  </div>
</div>
